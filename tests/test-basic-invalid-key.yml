name: Test basic usage with invalid key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          event: test-event
          key: fake-invalid-key-12345

      - name: Assert action ran and failed gracefully with invalid key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With a fake IFTTT key, the action should fail (HTTP 401 or similar)
          # and call core.setFailed — outcome will be 'failure'
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with an invalid key"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action unexpectedly succeeded (real key may have been injected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
