name: Test missing required input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          event: test-event
          # key is intentionally omitted to test required input validation
          key: ""
      - name: Assert action failed due to missing key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with missing key, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with missing required input"
